# =====================
#   基本設定 / Basics
# =====================
# 設定終端機色彩模式，確保 256 色和 true color 正常運作
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",xterm-ghostty:RGB"   # WSL+Ghostty 的 truecolor

# 啟用滑鼠支援 (可點擊切換窗格、滾動歷史紀錄等)
set -g mouse on

# 讓視窗 (window) 和窗格 (pane) 的起始編號從 1 開始，而不是預設的 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# 當有視窗被關閉時，自動重新編排視窗號碼
set-option -g renumber-windows on

# 允許所有視窗發送鈴聲訊號給外層終端機
set -g bell-action any
# 關閉 Tmux 自己的視覺閃爍，確保送出真實的系統鈴聲
set -g visual-bell off

# agent 感知：改用 bell（響鈴）而非 activity 來標記「agent 完成」
# activity 會因為「自上次查看後有過任何輸出」就一直亮，連閒置 window 都紅，太吵；
# bell 只在 agent 跑完響鈴那一刻觸發，才是「完成/需要你」的可靠訊號
setw -g monitor-activity off
setw -g monitor-bell on
set -g visual-activity off

# =====================
#      Keybindings
# =====================
# 解除預設的 % 鍵，改綁定 | 鍵為「左右分割」窗格，並保持當前路徑
unbind %
bind | split-window -h -c "#{pane_current_path}"
# 解除預設的 " 鍵，改綁定 _ 鍵為「上下分割」窗格，並保持當前路徑
unbind '"'
bind _ split-window -v -c "#{pane_current_path}"

# 將 Tmux 的主要快捷鍵 (Prefix/Leader) 從預設的 Ctrl+b 改為 Ctrl+s
set -g prefix C-s

# 設定 Prefix + r 為重新載入 tmux.conf 設定檔，並在狀態列顯示 Reloaded! 提示
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Prefix + , 改 window 名稱：清空舊的自動名稱、直接輸入新名
# （手動改名後 tmux 會自動關掉該 window 的 automatic-rename，名字就固定不再變回指令名）
unbind ,
bind , command-prompt -p "rename window:" "rename-window '%%'"

# 使用 Vim 的方向鍵邏輯 (h, j, k, l) 來調整窗格大小 (每次調整 5 個單位)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# 使用 Alt+數字直接切換到對應 window（不需按 prefix）
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# 在 Tmux 的複製模式中啟用 Vim 快捷鍵模式
set-window-option -g mode-keys vi
# 像在 Vim 一樣，按 'v' 開始選取反白
bind-key -T copy-mode-vi 'v' send -X begin-selection
# 'y' 複製交給 tmux-yank 插件接管，不手動綁定

# =====================
#        Plugins
# =====================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# 讓 Tmux 複製的內容可以直接進到系統剪貼簿
set -g @plugin 'tmux-plugins/tmux-yank'
# 讓 Tmux 工作階段 (Session) 可以手動存檔與還原
#   prefix + Ctrl-s 儲存，prefix + Ctrl-r 還原
# 不啟用 @resurrect-capture-pane-contents：避免還原時出現舊 prompt / 殘影造成混亂
set -g @plugin 'tmux-plugins/tmux-resurrect'
# 在背景每 15 分鐘自動儲存一次，作為手動還原的「最新備份」來源
set -g @plugin 'tmux-plugins/tmux-continuum'
# 開機不自動還原，避免帶回不想要的舊狀態
set -g @continuum-restore 'off'
set -g @plugin 'catppuccin/tmux'
# 無縫在 Vim 視窗和 Tmux 窗格之間切換
set -g @plugin 'christoomey/vim-tmux-navigator'

# =====================
#   佈景主題與狀態列設定 / Theme & status bar
# =====================
# 將狀態列移到終端機的最上方
set -g status-position top

# Catppuccin 色調
set -g @catppuccin_flavor "macchiato"

# 視窗狀態樣式：圓角外框
set -g @catppuccin_window_status_style "rounded"
# 顯示 activity/zoom/bell 等旗標圖示（v2 選項名是 window_flags，不是 window_status）
set -g @catppuccin_window_flags "icon"
# activity 標記關掉（設空字串）：即使有殘留 activity flag 也不顯示紅底
set -g @catppuccin_window_flags_icon_activity ""
# 背景 window 響鈴（bell = agent 完成/需要注意）時：整塊黃底色塊，一眼看到是哪個
# 注意：icon 會被塞進 catppuccin 的 #{?window_bell_flag,...,} 條件式，而 tmux 的
# #{?...} 用逗號分欄位；樣式必須拆成多個不含逗號的 #[...]，否則會在第一個逗號被截斷
set -g @catppuccin_window_flags_icon_bell "#[bg=#eed49f]#[fg=#181926]#[bold]  ●  #[default]"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
# 放大視窗 (zoomed) 時額外顯示提示符號
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"

# 狀態列 pill 樣式：左右都要圓角、彼此分開（不相連）
# 左帽  (U+E0B6) / 右帽  (U+E0B4)；connect_separator no 讓每個 pill
# 落在 default 背景上、彼此有間隔，而不是連成一整條
# （v0 的 @catppuccin_status_fill / _separator_inverse 在 v2 已無作用，故不設）
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# 目錄模組顯示「當前資料夾名稱」而不是完整路徑
set -g @catppuccin_directory_text " #{b:pane_current_path}"
# 時間模組顯示格式為 時:分 (24小時制)
set -g @catppuccin_date_time_text " %H:%M"

# 開啟擴展按鍵支援
set -s extended-keys on

# 明確告訴 tmux 這些終端機環境支援擴展按鍵
set -as terminal-features 'ghostty*:extkeys'
set -as terminal-features 'xterm-ghostty*:extkeys'
set -as terminal-features 'xterm*:extkeys'

# ---- 載入 tpm（所有 @plugin / @catppuccin_* 都要在這行之前）----
run '~/.tmux/plugins/tpm/tpm'

# =====================
#   狀態列組裝（一定要在 run tpm 之後）
# =====================
# 左側 window 分頁之間補一個空格，間距跟右側 pill 一致、不黏在一起
set -g window-status-separator " "

# session pill 後面補一個 default 背景空格，跟第一個 window 分頁分開、間距一致
set -g status-left "#{E:@catppuccin_status_session}#[bg=default,fg=default] "
set -g status-right ""
# 每個 pill 後面補一個 default 背景空格，讓 pill 之間看得出間距
set -ag status-right "#{E:@catppuccin_status_directory}#[bg=default,fg=default] "
set -ag status-right "#{E:@catppuccin_status_host}#[bg=default,fg=default] "
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
