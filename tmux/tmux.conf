# =====================
#       基本設定
# =====================
# 設定終端機色彩模式，確保 256 色和 true color 正常運作
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"

# 啟用滑鼠支援 (可點擊切換窗格、滾動歷史紀錄等)
set -g mouse on

# 讓視窗 (window) 和窗格 (pane) 的起始編號從 1 開始，而不是預設的 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# 當有視窗被關閉時，自動重新編排視窗號碼
set-option -g renumber-windows on

# 允許所有視窗發送鈴聲訊號給外層終端機
set -g bell-action any
# 關閉 Tmux 自己的視覺閃爍，確保送出真實的系統鈴聲
set -g visual-bell off

# =====================
#      Keybindings
# =====================
# 解除預設的 % 鍵，改綁定 | 鍵為「左右分割」窗格，並保持當前路徑
unbind %
bind | split-window -h -c "#{pane_current_path}" 
# 解除預設的 " 鍵，改綁定 _ 鍵為「上下分割」窗格，並保持當前路徑
unbind '"'
bind _ split-window -v -c "#{pane_current_path}"

# 將 Tmux 的主要快捷鍵 (Prefix/Leader) 從預設的 Ctrl+b 改為 Ctrl+s
set -g prefix C-s

# 設定 Prefix + r 為重新載入 tmux.conf 設定檔
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# 使用 Vim 的方向鍵邏輯 (h, j, k, l) 來調整窗格大小 (每次調整 5 個單位)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# 在 Tmux 的複製模式中啟用 Vim 快捷鍵模式
set-window-option -g mode-keys vi
# 像在 Vim 一樣，按 'v' 開始選取反白
bind-key -T copy-mode-vi 'v' send -X begin-selection
# 像在 Vim 一樣，按 'y' 複製選取的文字
bind-key -T copy-mode-vi 'y' send -X copy-selection
# 取消「滑鼠拖曳結束後自動離開複製模式」的預設行為，方便確認選取範圍
unbind -T copy-mode-vi MouseDragEnd1Pane

# =====================
#        Plugins
# =====================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# 讓 Tmux 複製的內容可以直接進到系統剪貼簿
set -g @plugin 'tmux-plugins/tmux-yank'
# 讓 Tmux 工作階段 (Session) 可以在電腦重開機後依然保留並還原
set -g @plugin 'tmux-plugins/tmux-resurrect'
# 同時儲存每個 pane 的文字內容
set -g @resurrect-capture-pane-contents 'on'
# 自動在背景每 15 分鐘幫你儲存一次 Tmux 工作階段
set -g @plugin 'tmux-plugins/tmux-continuum'
# 開機後自動還原上次的工作階段
set -g @continuum-restore 'on'
set -g @plugin 'catppuccin/tmux'
# 無縫在 Vim 視窗和 Tmux 窗格之間切換
set -g @plugin 'christoomey/vim-tmux-navigator'

# =====================
#   佈景主題與狀態列設定
# =====================
# 將狀態列移到終端機的最上方
set -g status-position top

# 設定非作用中視窗的狀態樣式
setw -g window-status-activity-style "underscore,fg=#7e8188,bg=#232831"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#7e8188,bg=#232831"
# 自訂非作用中視窗的顯示格式 (包含特殊形狀的分隔符號)
setw -g window-status-format "#[fg=#232831,bg=#232831,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#232831,bg=#232831,nobold,nounderscore,noitalics]"
# 自訂「當前作用中」視窗的顯示格式 (反白並加粗)
setw -g window-status-current-format "#[fg=#232831,bg=#abb1bb,nobold,nounderscore,noitalics]#[fg=#232831,bg=#abb1bb,bold] #I  #W #F #[fg=#abb1bb,bg=#232831,nobold,nounderscore,noitalics]"

# Catppuccin 主題的細部客製化 (圓角分隔符號設定)
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

# 視窗預設文字顯示內容
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

# 當前視窗文字顯示內容 (如果有放大視窗 zoomed，會顯示特殊圖示 )
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

# 狀態列右側顯示模組：當前目錄、主機名稱、時間
set -g @catppuccin_status_modules_right "directory host date_time"
# 狀態列左側顯示模組：工作階段 (Session) 名稱
set -g @catppuccin_status_modules_left "session"

# 狀態列特殊符號與外觀設定
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# 設定右側目錄模組顯示「當前資料夾名稱」而不是完整路徑
set -g @catppuccin_directory_text "#{b:pane_current_path}"
# 設定右側時間模組顯示格式為 時:分 (24小時制)
set -g @catppuccin_date_time_text "%H:%M"

# 初始化 TMUX 外掛管理器 (這行必須一直保持在 tmux.conf 的最底部！)
run '~/.tmux/plugins/tpm/tpm'

